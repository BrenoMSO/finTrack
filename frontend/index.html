<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>FinTrack - Controle de Despesas</title>
    
    <link rel="stylesheet" href="/frontend/style.css">
</head>
<body>

    <header>
        <h1>FinTrack</h1>
        <p>Sua jornada para o controle financeiro, um commit de cada vez.</p>
    </header>

    <main>
        
        <section id="form-secao">
            <h2>Adicionar Nova Despesa</h2>
            <form id="despesa-form">
                
                <div>
                    <label for="descricao">Descrição:</label>
                    <input type="text" id="descricao" required>
                </div>
                
                <div>
                    <label for="valor">Valor (R$):</label>
                    <input type="number" id="valor" step="0.01" min="0.01" required>
                </div>
                
                <div>
                    <label for="categoria">Categoria:</label>
                    <select id="categoria" required>
                        <option value="">Selecione...</option>
                        <option value="Alimentação">Alimentação</option>
                        <option value="Transporte">Transporte</option>
                        <option value="Moradia">Moradia</option>
                        <option value="Entretenimento">Entretenimento</option>
                        <option value="Contas">Contas</option>
                        <option value="Outros">Outros</option>
                    </select>
                </div>

                <button type="submit">Adicionar Despesa</button>
            </form>
        </section>

        <hr> <section id="lista-secao">
            <h2>Minhas Despesas</h2>
            <ul id="lista-despesas">
                </ul>
        </section>

    </main>

    <footer>
        <p>&copy; 2025 FinTrack. Todos os direitos reservados.</p>
    </footer>

    <script src="js/app.js"></script>
</body>
</html>
