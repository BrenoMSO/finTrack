<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinTrack - Controle Financeiro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>FinTrack</h1>
        <p>Sua jornada para o controle financeiro, um commit de cada vez.</p>
    </header>

    <main>
        <!-- Resumo Financeiro / Dashboard -->
        <section id="dashboard-secao">
            <h2>Resumo Financeiro</h2>
            <div class="cards-container">
                <div class="card card-receitas">
                    <h3>Receitas</h3>
                    <p id="total-receitas">R$ 0,00</p>
                </div>
                <div class="card card-despesas">
                    <h3>Despesas</h3>
                    <p id="total-despesas">R$ 0,00</p>
                </div>
                <div class="card card-saldo">
                    <h3>Saldo Total</h3>
                    <p id="saldo-total">R$ 0,00</p>
                </div>
            </div>
        </section>

        <hr>

        <!-- Formulário para Adicionar Transação -->
        <section id="form-secao">
            <h2>Adicionar Nova Transação</h2>
            <form id="despesa-form">
                <div>
                    <label for="descricao">Descrição:</label>
                    <input type="text" id="descricao" placeholder="Ex: Salário, Aluguel, Supermercado" required>
                </div>

                <div>
                    <label for="valor">Valor (R$):</label>
                    <input type="number" id="valor" step="0.01" min="0.01" placeholder="0.00" required>
                </div>

                <div>
                    <label for="tipo">Tipo:</label>
                    <select id="tipo" required>
                        <option value="expense">Despesa</option>
                        <option value="income">Receita</option>
                    </select>
                </div>

                <div>
                    <label for="categoria">Categoria:</label>
                    <select id="categoria" required>
                        <option value="">Selecione...</option>
                        <option value="Alimentação">Alimentação</option>
                        <option value="Transporte">Transporte</option>
                        <option value="Moradia">Moradia</option>
                        <option value="Entretenimento">Entretenimento</option>
                        <option value="Contas">Contas</option>
                        <option value="Salário">Salário</option>
                        <option value="Serviços">Serviços</option>
                        <option value="Pagamentos Instantâneos">Pagamentos Instantâneos</option>
                        <option value="Outros">Outros</option>
                    </select>
                </div>

                <button type="submit" id="btn-salvar">Adicionar Transação</button>
            </form>
        </section>

        <hr>

        <!-- Tabela de Transações e Botão Open Finance -->
        <section id="lista-secao">
            <div class="secao-cabecalho">
                <h2>Minhas Transações</h2>
                <button type="button" id="btn-sync-open-finance" class="btn-sync">
                    🔄 Sincronizar Open Finance
                </button>
            </div>

            <div class="tabela-container">
                <table id="tabela-transacoes" class="tabela-transacoes">
                    <thead>
                        <tr>
                            <th>Data</th>
                            <th>Descrição</th>
                            <th>Categoria</th>
                            <th>Tipo</th>
                            <th>Valor</th>
                        </tr>
                    </thead>
                    <tbody id="tabela-transacoes-corpo">
                        <!-- Itens renderizados dinamicamente pelo script.js -->
                    </tbody>
                </table>
            </div>

            <!-- Compatibilidade -->
            <ul id="lista-despesas" style="display: none;"></ul>
        </section>

    </main>

    <footer>
        <p>&copy; 2025 FinTrack. Todos os direitos reservados.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
